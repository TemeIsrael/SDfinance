version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sdfinance-mysql
    environment:
      MYSQL_ROOT_PASSWORD: israelenspy
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: sdfinance-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: sdfinance-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  auth-service:
    build:
      context: .
      args:
        SERVICE_NAME: auth-service
    container_name: sdfinance-auth
    depends_on:
      - mysql
      - kafka
    environment:
      - DB_HOST=mysql
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    ports:
      - "8081:8081"

  member-service:
    build:
      context: .
      args:
        SERVICE_NAME: member-service
    container_name: sdfinance-member
    depends_on:
      - mysql
      - kafka
    environment:
      - DB_HOST=mysql
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    ports:
      - "8082:8082"

  event-service:
    build:
      context: .
      args:
        SERVICE_NAME: event-service
    container_name: sdfinance-event
    depends_on:
      - mysql
      - kafka
    environment:
      - DB_HOST=mysql
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    ports:
      - "8083:8083"

  finance-service:
    build:
      context: .
      args:
        SERVICE_NAME: finance-service
    container_name: sdfinance-finance
    depends_on:
      - mysql
      - kafka
    environment:
      - DB_HOST=mysql
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    ports:
      - "8084:8084"

  messaging-service:
    build:
      context: .
      args:
        SERVICE_NAME: messaging-service
    container_name: sdfinance-messaging
    depends_on:
      - mysql
      - kafka
    environment:
      - DB_HOST=mysql
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    ports:
      - "8085:8085"

volumes:
  mysql_data:
