resolver 127.0.0.11 valid=10s;

server {
    listen 8080;
    server_name localhost;

    # Frontend Vue.js
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API Proxy vers Auth Service
    location /api/auth/ {
        set $upstream_auth auth-service:8081;
        proxy_pass http://$upstream_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API Proxy vers Member Service
    location /api/members/ {
        set $upstream_member member-service:8082;
        proxy_pass http://$upstream_member;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API Proxy vers Event Service
    location /api/events/ {
        set $upstream_event event-service:8083;
        proxy_pass http://$upstream_event;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API Proxy vers Finance Service
    location /api/finance/ {
        set $upstream_finance finance-service:8084;
        proxy_pass http://$upstream_finance;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API Proxy vers Messaging Service
    location /api/messaging/ {
        set $upstream_messaging messaging-service:8085;
        proxy_pass http://$upstream_messaging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
